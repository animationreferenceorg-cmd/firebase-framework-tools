# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure
runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
  # These are secret environment variables, whose values are stored in Secret
  # Manager. Specify the secret and a version.
  # You can create a secret and grant access to the App Hosting service account by running
  # `gcloud secrets create <secret> --project=<project>> --data-file=-` and
  # `gcloud secrets add-iam-policy-binding <secret> --project=<project> --role=roles/secretmanager.secretAccessor --member=serviceAccount:<service-account-email>`
  # You can find your service account email in the Firebase console settings.
  env:
    - variable: NEXT_PUBLIC_STRIPE_PRICE_PRO_MONTHLY
      value: price_1UJczS59QHehw05fbqoQC0Po
      availability: [BUILD, RUNTIME]
    - variable: NEXT_PUBLIC_STRIPE_PRICE_PRO_ANNUAL
      value: price_1UJd4X59QHehw05fqbQ2qZLs
      availability: [BUILD, RUNTIME]
    - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
      value: pk_live_51SFfWk59QHehw05fAQmlkaJZ6ys02e7g5EwfG44sUIkSvC0F6fos5TyfIzMvCHAoMrI7piuOdUfwglN7jh2CFAuK00pBgZ4uI7
      availability: [BUILD, RUNTIME]
    - variable: STRIPE_SECRET_KEY
    - variable: STRIPE_WEBHOOK_SECRET
    - variable: RESEND_API_KEY
    - variable: RESEND_FROM_EMAIL
    # Social auto-poster (see /admin/social) — set these via Secret Manager
    # once you have credentials for each platform. Missing ones just show
    # "Needs Env Setup" in the admin UI and are skipped by the daily bot.
    - variable: CRON_SECRET
    - variable: INSTAGRAM_ACCOUNT_ID
    - variable: META_PAGE_ACCESS_TOKEN
    - variable: X_API_KEY
    - variable: X_API_KEY_SECRET
    - variable: X_ACCESS_TOKEN
    - variable: X_ACCESS_TOKEN_SECRET
    - variable: LINKEDIN_ACCESS_TOKEN
    - variable: LINKEDIN_ORGANIZATION_URN

